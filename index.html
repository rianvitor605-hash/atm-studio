
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>ATM STUDIO</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#071426;color:#f4f7ff;
  font-family:Arial,sans-serif;min-height:100vh;
  display:flex;justify-content:center;align-items:center;padding:18px
}
.app{
  width:100%;max-width:420px;background:#101f35;
  border:1px solid #294563;border-radius:24px;
  padding:24px;box-shadow:0 18px 50px #0008
}
.brand{color:#43d9c2;font-size:13px;letter-spacing:3px}
h1{font-size:29px;margin:8px 0}
.subtitle{color:#a9bad1;font-size:14px}
.screen{
  margin:24px 0;padding:22px 16px;min-height:155px;
  border-radius:16px;background:#071426;border:1px solid #294563;
  text-align:center;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px
}
.screen small{color:#a9bad1}
#message{font-size:20px;font-weight:bold;overflow-wrap:anywhere}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{
  background:#193653;color:white;border:1px solid #345779;
  border-radius:12px;padding:16px 8px;font-size:14px;
  font-weight:bold;cursor:pointer
}
button:active{transform:scale(.98)}
button.primary{background:#43d9c2;color:#071426;border:0}
button.wide{grid-column:1/-1}
.footer{margin-top:22px;text-align:center;color:#8195b0;font-size:12px}
</style>
</head>
<body>
<main class="app">
  <div class="brand">ATM STUDIO / SIMULATOR</div>
  <h1>Caixa Digital</h1>
  <p class="subtitle">Ambiente de demonstração</p>

  <section class="screen" aria-live="polite">
    <small id="label">BEM-VINDO</small>
    <div id="message">Escolha uma opção</div>
  </section>

  <div class="buttons">
    <button class="primary" onclick="showBalance()">Consultar saldo</button>
    <button onclick="withdraw()">Simular saque</button>
    <button onclick="deposit()">Simular depósito</button>
    <button onclick="resetScreen()">Início</button>
    <button class="wide" onclick="about()">Sobre o ATM STUDIO</button>
  </div>

  <div class="footer">
    SIMULAÇÃO LOCAL · SEM TRANSAÇÕES REAIS
  </div>
</main>

<script>
let balance = 1000;

function display(title, message) {
  document.getElementById("label").textContent = title;
  document.getElementById("message").textContent = message;
}

function showBalance() {
  display("SALDO DEMONSTRATIVO",
    balance.toLocaleString("pt-BR", {
      style:"currency", currency:"BRL"
    }));
}

function withdraw() {
  const amount = Number(prompt("Valor do saque simulado (R$):"));
  if (!Number.isFinite(amount) || amount <= 0) {
    display("AVISO", "Digite um valor válido.");
    return;
  }
  if (amount > balance) {
    display("SAQUE SIMULADO", "Saldo demonstrativo insuficiente.");
    return;
  }
  balance -= amount;
  display("SAQUE SIMULADO", "Operação concluída!");
}

function deposit() {
  const amount = Number(prompt("Valor do depósito simulado (R$):"));
  if (!Number.isFinite(amount) || amount <= 0) {
    display("AVISO", "Digite um valor válido.");
    return;
  }
  balance += amount;
  display("DEPÓSITO SIMULADO", "Valor adicionado à demonstração.");
}

function resetScreen() {
  display("BEM-VINDO", "Escolha uma opção");
}

function about() {
  display("SOBRE", "ATM STUDIO — projeto educativo.");
}
</script>
</body>
</html>
